<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15171A">
<link rel="icon" href="/orbis-icon-192.png">
<title>CRM da Vant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F2EF; --panel:#FCFCFB; --panel2:#F7F6F3; --rail:#15171A;
  --ink:#13161A; --dim:#5B626D; --faint:#8A909C; --line:#E2E0DB; --line2:#CFCCC5;
  --c1:#3B6FE0; --c2:#0F9E78; --c3:#D9432A; --c4:#8B5CF0;
  --c1s:#E6EDFC; --c2s:#DFF3ED; --c3s:#FBE7E2; --c4s:#EFE9FD;
  --ok:#0F9E78; --ok-s:#DFF3ED; --warn:#B5760D; --warn-s:#FBF0DC;
  --bad:#C4321A; --bad-s:#FBE3DD;
  --shadow:0 1px 2px rgba(16,18,20,.05),0 8px 24px -16px rgba(16,18,20,.26);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F12; --panel:#16191D; --panel2:#1B1F24; --rail:#08090B;
  --ink:#E8EAED; --dim:#949AA5; --faint:#6A707D; --line:#242930; --line2:#333942;
  --c1:#4E86EC; --c2:#0FAE86; --c3:#EC6244; --c4:#9370EE;
  --c1s:#141F33; --c2s:#0B2B24; --c3s:#301A15; --c4s:#201A38;
  --ok:#0FAE86; --ok-s:#0B2B24; --warn:#E0A43A; --warn-s:#2C2212;
  --bad:#EC6244; --bad-s:#301A15;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{
  --bg:#0D0F12; --panel:#16191D; --panel2:#1B1F24; --rail:#08090B;
  --ink:#E8EAED; --dim:#949AA5; --faint:#6A707D; --line:#242930; --line2:#333942;
  --c1:#4E86EC; --c2:#0FAE86; --c3:#EC6244; --c4:#9370EE;
  --c1s:#141F33; --c2s:#0B2B24; --c3s:#301A15; --c4s:#201A38;
  --ok:#0FAE86; --ok-s:#0B2B24; --warn:#E0A43A; --warn-s:#2C2212;
  --bad:#EC6244; --bad-s:#301A15;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.85);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px;border-radius:6px}
.shell{max-width:1120px;margin:0 auto;padding-inline:14px;padding-block:18px 96px}
@media(min-width:720px){.shell{padding-inline:20px;padding-block:22px 60px}}

.top{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.mark{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--rail)}
.top h1{font-size:15px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.top p{margin:0;font-size:10.5px;color:var(--faint)}
.top .sp{flex:1}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--c2s);color:var(--c2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}

.tabs{display:none}
@media(min-width:720px){.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
  .tabs button{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--dim);text-align:center}
  .tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.navbar{display:none}}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  font-size:10.5px;font-weight:600;color:var(--faint);border-radius:9px;text-align:center}
.navbar button[aria-selected="true"]{color:var(--c1);background:var(--c1s)}

h2.sec{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
h2.sec:first-child{margin-top:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.pad{padding:14px 15px}

/* dinheiro */
.grana{background:var(--rail);border-radius:15px;padding:16px 16px 8px;color:#fff}
.grana .lbl{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.grana .big{font-size:clamp(30px,9vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:4px 0 0}
.grana .sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:3px}
.gline{display:grid;gap:13px;grid-template-columns:repeat(2,1fr);margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12)}
@media(min-width:620px){.gline{grid-template-columns:repeat(4,1fr)}}
.gcell .k{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);line-height:1.3}
.gcell .v{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.gcell .n{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:1px}
.gcell.perda .k,.gcell.perda .v{color:#FF8A6B}
.gcell.perda .n{color:rgba(255,138,107,.65)}
.spark{display:flex;align-items:flex-end;gap:3px;height:48px;margin:14px 0 0}
.spark .b{flex:1;border-radius:3px 3px 0 0;background:rgba(255,255,255,.26);min-height:2px}
.spark .b.hoje{background:#FFB020}
.fonte{font-size:10.5px;color:rgba(255,255,255,.4);padding:9px 0 8px;line-height:1.45}
.fonte b{color:rgba(255,255,255,.7)}

.alerta{border:1px solid var(--bad);background:var(--bad-s);border-radius:13px;padding:13px 14px;display:flex;gap:11px;margin-top:14px}
.alerta .ic{flex:none;color:var(--bad);margin-top:1px}
.alerta h3{margin:0 0 3px;font-size:14px;font-weight:700;color:var(--bad)}
.alerta p{margin:0;font-size:13px;line-height:1.5}
.cta{margin-top:9px;background:var(--bad);color:#fff;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600}

.strip{display:grid;gap:9px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.strip{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat .k{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:3px}
.stat .s{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:7px 0 5px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c2)}

/* ficha do dia */
.fila{display:grid;gap:14px}
@media(min-width:960px){.fila{grid-template-columns:1fr 296px;align-items:start}}
.fh{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px}
.blob{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.fh h3{font-size:17px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.p1{color:var(--c1);border-color:var(--c1);background:var(--c1s)}
.pill.p2{color:var(--c2);border-color:var(--c2);background:var(--c2s)}
.pill.p3{color:var(--c3);border-color:var(--c3);background:var(--c3s)}
.pill.p4{color:var(--c4);border-color:var(--c4);background:var(--c4s)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-s)}
.porque{margin:0;padding:11px 15px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;line-height:1.5}
.blk{padding:13px 15px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk h4{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}

/* ATIVIDADE com mensagem embutida */
.ativ{border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden;background:var(--panel)}
.ativ.on{border-color:var(--c2);background:var(--c2s)}
.ativ-h{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;cursor:pointer;width:100%}
.cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center}
.ativ.on .cbox{background:var(--c2);border-color:var(--c2)}
.cbox svg{opacity:0}.ativ.on .cbox svg{opacity:1}
.ativ-h .tt{flex:1;font-size:13px;line-height:1.4}
.ativ.on .tt{color:var(--dim);text-decoration:line-through}
.ativ-h .cv{flex:none;color:var(--faint);transition:transform .15s}
.ativ[data-open="1"] .cv{transform:rotate(180deg)}
.ativ-b{padding:0 11px 11px;border-top:1px solid var(--line)}
.msg{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;
  font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-top:10px}
.msg.nota{font-style:italic;color:var(--dim);white-space:normal}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btn{padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);
  background:var(--panel);transition:transform .1s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--c2);border-color:var(--c2);color:#fff}
.btn.ghost{color:var(--dim)}
.btn.win{border-color:var(--c2);color:var(--c2);background:var(--c2s)}
.btn.lose{border-color:var(--bad);color:var(--bad);background:var(--bad-s)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.block{width:100%;display:block}

/* sinais do lead */
.sinais{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));margin-top:2px}
.sin{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.sin .k{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sin .v{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.sin.q{border-color:var(--bad);background:var(--bad-s)}
.sin.q .v,.sin.q .k{color:var(--bad)}
.temp{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel2);margin-top:9px;font-size:12.5px;line-height:1.5}
.temp.q{border-color:var(--bad);background:var(--bad-s)}
.temp.w{border-color:var(--warn);background:var(--warn-s)}
.temp .e{font-size:17px;flex:none;line-height:1.2}
.temp b{font-weight:700}
/* conversa */
.chat{display:flex;flex-direction:column;gap:7px;max-height:280px;overflow-y:auto;padding:2px 0 6px}
.bal{max-width:84%;padding:8px 11px;border-radius:13px;font-size:12.5px;line-height:1.45;position:relative;white-space:pre-wrap;word-break:break-word}
.bal .q{display:block;font-size:9.5px;margin-top:3px;opacity:.6}
.bal.eu{align-self:flex-end;background:var(--c2);color:#fff;border-bottom-right-radius:4px}
.bal.ele{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.janela{font-size:11px;padding:7px 10px;border-radius:8px;margin-top:8px;line-height:1.45}
.janela.free{background:var(--c2s);color:var(--c2);border:1px solid var(--c2)}
.janela.pago{background:var(--warn-s);color:var(--warn);border:1px solid var(--warn)}
.envio{display:flex;gap:6px;margin-top:9px}
.envio input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;
  font:inherit;font-size:12.5px;background:var(--panel2);color:var(--ink)}
.atalhos{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.atalho{font-size:11px;font-weight:600;padding:5px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.atalho:hover{border-color:var(--ink);color:var(--ink)}
/* alertas */
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle}
.nb{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center}
.navbar button{position:relative}
.alerta-l{display:flex;gap:11px;align-items:flex-start;padding:12px 0;width:100%;border-bottom:1px solid var(--line)}
.alerta-l:last-child{border-bottom:0}
.al-ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px}
.alerta-l .tx{flex:1;min-width:0;display:block}
.alerta-l .tt{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.alerta-l .ds{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.45}
.alerta-l .go{font-size:11px;font-weight:700;color:var(--c1);white-space:nowrap;flex:none;align-self:center}
.destrava{margin-top:9px;font-size:11.5px;color:var(--dim);background:var(--panel2);
  border:1px dashed var(--line2);border-radius:9px;padding:8px 10px;line-height:1.45}
.destrava.ok{border-color:var(--c2);color:var(--c2);background:var(--c2s);border-style:solid}
.desf{display:grid;gap:7px;grid-template-columns:1fr 1fr}

.lado{display:flex;flex-direction:column;gap:11px}
.prox{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:12.5px;width:100%}
.prox+.prox{border-top:1px solid var(--line)}
.prox .n{width:16px;font-size:10.5px;font-weight:700;color:var(--faint);flex:none}
.prox .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.mini-h{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}

/* esteiras */
.est-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.est-head h3{margin:0;font-size:14px;font-weight:700}
.est-head .c{font-size:11px;color:var(--faint);margin-left:auto}
.cols{display:flex;gap:1px;background:var(--line);overflow-x:auto;scroll-snap-type:x mandatory}
.col{background:var(--panel);padding:10px;min-width:176px;flex:1 0 176px;scroll-snap-align:start}
@media(min-width:800px){.cols{display:grid;grid-template-columns:repeat(var(--n,4),1fr);overflow:visible}.col{min-width:0;flex:none}}
.col-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.col-h .t{font-size:11px;font-weight:700;flex:1;line-height:1.3}
.col-h .q{font-size:11px;font-weight:700;color:var(--faint)}
.chip{background:var(--panel2);border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  padding:7px 8px;margin-bottom:5px;font-size:12px;cursor:pointer;width:100%;transition:transform .1s}
.chip:hover{transform:translateX(2px)}
.chip.morto{border-color:var(--bad);background:var(--bad-s)}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sb{font-size:10px;color:var(--faint);margin-top:2px}
.chip .sb.bad{color:var(--bad);font-weight:600}
.mais{font-size:10.5px;color:var(--faint);padding:4px 2px}

/* metricas */
.taxas{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.taxa{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;width:100%;
  cursor:pointer;transition:border-color .13s,transform .1s;position:relative}
.taxa:hover{border-color:var(--line2);transform:translateY(-1px)}
.taxa .k{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.taxa .v{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:4px}
.taxa .s{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4}
.taxa .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.taxa .bar i{display:block;height:100%;border-radius:99px}
.taxa .ver{position:absolute;top:11px;right:11px;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint)}

.funil{display:flex;flex-direction:column;gap:2px}
.fstep{display:flex;align-items:center;gap:10px;width:100%;padding:2px 0;cursor:pointer}
.fstep:hover .track{outline:1px solid var(--line2)}
.fstep .lbl{font-size:12px;min-width:106px;flex:none}
.fstep .track{flex:1;height:26px;background:var(--panel2);border-radius:5px;overflow:hidden;min-width:50px}
.fstep .track i{display:block;height:100%;border-radius:4px}
.fstep .v{font-size:12.5px;font-weight:700;min-width:64px;text-align:right;color:var(--dim)}

.barras{display:flex;align-items:flex-end;gap:4px;height:118px;margin-top:8px}
.barras .c2{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.barras .bb{width:100%;border-radius:4px 4px 0 0;background:var(--c1);min-height:2px}
.barras .bb.zero{background:var(--line2)}
.barras .dt{font-size:9px;color:var(--faint)}
.tabela{width:100%;border-collapse:collapse;font-size:12.5px}
.tabela th,.tabela td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tabela th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.tabela td.n,.tabela th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabela tr:last-child td{border-bottom:0}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px}
.nota{font-size:11.5px;color:var(--faint);line-height:1.55;margin:11px 0 0}
.nota b{color:var(--dim)}

/* PAINEL LATERAL (drawer) */
.veu{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.veu[data-on="1"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:71;background:var(--panel);display:flex;flex-direction:column;
  transition:transform .24s ease;box-shadow:0 0 60px -10px rgba(0,0,0,.45)}
@media(max-width:719px){.drawer{left:0;right:0;bottom:0;top:34px;border-radius:16px 16px 0 0;transform:translateY(102%)}
  .drawer[data-on="1"]{transform:translateY(0)}}
@media(min-width:720px){.drawer{top:0;bottom:0;right:0;width:min(460px,100%);transform:translateX(102%)}
  .drawer[data-on="1"]{transform:translateX(0)}}
.dr-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start;flex:none}
.dr-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.fechar{margin-left:auto;flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.fechar:hover{background:var(--panel2);color:var(--ink)}
.dr-body{overflow-y:auto;flex:1;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.dr-sec{padding:13px 16px;border-bottom:1px solid var(--line)}
.dr-sec h4{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--faint)}
.kv .v{font-weight:600;text-align:right}
.trilha{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tstep{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
.tstep.pass{background:var(--c2s);border-color:var(--c2);color:var(--c2)}
.tstep.now{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tstep.bad{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.mover{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.mv{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);color:var(--dim)}
.mv:hover:not([disabled]){border-color:var(--ink);color:var(--ink)}
.mv[disabled]{opacity:.4;cursor:not-allowed}
.txtarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;font:inherit;font-size:12.5px;
  background:var(--panel2);color:var(--ink);resize:vertical;min-height:62px}
.lista-p{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:13px;width:100%;border-bottom:1px solid var(--line)}
.lista-p:last-child{border-bottom:0}
.lista-p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lista-p .mt{font-size:11px;color:var(--faint)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  background:var(--rail);color:#fff;padding:9px 17px;border-radius:99px;font-size:12.5px;font-weight:600;
  z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
@media(min-width:720px){.toast{bottom:22px}}
.toast[data-on="1"]{opacity:1}
.vazio{padding:34px 18px;text-align:center;color:var(--faint);font-size:13.5px}
.vazio strong{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
#telaLogin{min-height:100dvh;display:grid;place-items:center;padding:20px}
.loginbox{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.loginbox h2{margin:12px 0 4px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.loginbox p{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
.loginbox input{width:100%;border:1px solid var(--line2);border-radius:9px;padding:11px 12px;
  font:inherit;font-size:14px;background:var(--panel2);color:var(--ink);margin-bottom:8px}
#erroLogin{font-size:12.5px;line-height:1.45;min-height:16px;margin-top:8px;border-radius:9px;padding:0}
#erroLogin:not(:empty){padding:9px 11px;border:1px solid var(--bad);background:var(--bad-s);color:var(--bad);font-weight:600}
#erroLogin.andamento:not(:empty){border-color:var(--line2);background:var(--panel2);color:var(--dim);font-weight:500}
#btEntrar[disabled]{opacity:.55;cursor:wait}
#carregando{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;
  font-size:13px;color:var(--dim);gap:10px}
.spin{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--c1);
  border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}
.pbox{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%}
.pbox:last-child{border-bottom:0}
.pbox .nm{flex:1;min-width:0}
.pbox .nm b{display:block;font-size:13.5px}
.pbox .nm span{display:block;font-size:11px;color:var(--faint);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox .st{text-align:right;font-size:11px;color:var(--dim);flex:none}
.pbox .st b{display:block;font-size:15px;color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
  html,body{min-height:100%}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>


<div id="telaLogin">
  <div class="loginbox">
    <span class="mark" style="width:38px;height:38px"><svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#3a3f46" stroke-width="6"/>
      <path d="M37 41 L50 61 L64 34" fill="none" stroke="#FFB020" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></span>
    <h2>CRM da Vant</h2>
    <p>Entre com o mesmo CPF (ou e-mail) e senha do app Orbis.</p>
    <input id="inEmail" placeholder="CPF ou e-mail" autocomplete="username" inputmode="text">
    <input id="inSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn go block" id="btEntrar" style="margin-top:4px" disabled>Carregando…</button>
    <div id="erroLogin" role="alert" aria-live="polite"></div>
  </div>
</div>

<div id="app" hidden>
<div class="shell">
  <div class="top">
    <span class="mark"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="32" fill="none" stroke="#3a3f46" stroke-width="6"/>
      <path d="M37 41 L50 61 L64 34" fill="none" stroke="#FFB020" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></span>
    <div><h1>CRM da Vant</h1><p>Dados ao vivo do banco e da Hotmart</p></div>
    <span class="sp"></span>
    <button class="btn ghost" id="btAtualizar" style="padding:6px 11px;font-size:12px">Atualizar</button>
    <span class="avatar" id="quemSou" title="Conectado">Y</span>
    <button class="btn ghost" id="btSair" style="padding:6px 11px;font-size:12px">Sair</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="hoje">Hoje</button>
    <button role="tab" aria-selected="false" data-tab="esteiras">Esteiras</button>
    <button role="tab" aria-selected="false" data-tab="alertas">Alertas <span class="badge" id="bd-d">0</span></button>
    <button role="tab" aria-selected="false" data-tab="metricas">Métricas</button>
    <button role="tab" aria-selected="false" data-tab="parceiros">Parceiros</button>
  </div>
  <section id="p-hoje"></section>
  <section id="p-alertas" hidden></section>
  <section id="p-esteiras" hidden></section>
  <section id="p-metricas" hidden></section>
  <section id="p-parceiros" hidden></section>
</div>

</div>
<nav class="navbar" role="tablist" aria-label="Navegação">
  <button role="tab" aria-selected="true" data-tab="hoje"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Hoje</button>
  <button role="tab" aria-selected="false" data-tab="esteiras"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.4"/><rect x="9.5" y="4" width="5" height="11" rx="1.4"/><rect x="16" y="4" width="5" height="7" rx="1.4"/></svg>Esteiras</button>
  <button role="tab" aria-selected="false" data-tab="alertas"><span class="nb" id="bd-m">0</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6ZM10.5 20a2 2 0 0 0 3 0"/></svg>Alertas</button>
  <button role="tab" aria-selected="false" data-tab="metricas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V4M16 19v-7M22 19H2"/></svg>Métricas</button>
  <button role="tab" aria-selected="false" data-tab="parceiros"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Links</button>
</nav>
</div>

<div id="diag" hidden style="max-width:1120px;margin:14px auto;padding:14px 16px;border-radius:12px;
  border:1px solid var(--bad);background:var(--bad-s);color:var(--ink);font-size:13px;line-height:1.55"></div>
<div id="carregando" hidden><div style="text-align:center"><div class="spin"></div>Carregando o CRM…</div></div>
<div class="veu" id="veu"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Painel"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/crm.js?v=3" defer></script>
</body>
</html>
