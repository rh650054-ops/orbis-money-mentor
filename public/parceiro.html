<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Vant Parceiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* VANT PARCEIROS v3 (06/10/2026) — o painel do influenciador.
   Ideia: o que ele mais quer saber é "quanto vou receber e quando". O topo é um
   comprovante de Pix (o próximo pagamento), com borda picotada. Depois vem o link
   com o botão de mandar no WhatsApp. Números grandes em Archivo condensado. */
:root{
  --bg:#000;--sf:#141413;--sf2:#1b1b19;--ink:#F4F1EA;--ink2:#BDB7AA;--ink3:#827C6E;--ink4:#58534A;--line:rgba(255,255,255,.08);
  --gold:#F5B800;--gold2:#FFD34D;--goldd:#B88700;--goldbg:rgba(245,184,0,.10);
  --ok:#3DD68C;--okbg:rgba(61,214,140,.12);--warn:#F5A54A;--warnbg:rgba(245,165,74,.12);--bad:#FF6B57;--badbg:rgba(255,107,87,.12);--teste:#7FB2FF;--testebg:rgba(127,178,255,.12);
  --d:"Archivo",system-ui,sans-serif;--t:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--t);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.n{font-family:var(--d);font-variant-numeric:tabular-nums;font-stretch:72%;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

/* topo */
.topo{display:flex;gap:12px;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px}
.av{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;background:var(--goldbg);border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:18px}
.av img{width:100%;height:100%;object-fit:cover}
.topo h1{margin:0;font-family:var(--d);font-stretch:88%;font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.topo p{margin:2px 0 0;font-size:12.5px;color:var(--ink3)}
.nv{color:var(--gold);font-weight:600}

/* comprovante do próximo Pix */
.recibo{position:relative;background:linear-gradient(170deg,#1f1a08,#141413 62%);border:1px solid rgba(245,184,0,.32);border-radius:22px;padding:18px}
/* picote de comprovante entre o valor e o resumo do mês */
.picote{height:0;border-top:2px dashed rgba(245,184,0,.25);margin:16px -18px 0;position:relative}
.picote:before,.picote:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid rgba(245,184,0,.32)}
.picote:before{left:-11px;clip-path:inset(0 0 0 50%)}
.picote:after{right:-11px;clip-path:inset(0 50% 0 0)}
.recibo .rot{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.recibo .rot b{color:var(--gold);font-weight:600}
.recibo .v{font-family:var(--d);font-weight:900;font-stretch:68%;font-size:62px;line-height:.95;letter-spacing:-.02em;margin:10px 0 4px;color:var(--gold)}
.recibo .v small{font-size:26px;font-weight:700;margin-right:4px;vertical-align:.55em}
.recibo .sub{font-size:13px;color:var(--ink2)}
.mes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mes div{padding:0 2px}
.mes b{display:block;font-family:var(--d);font-stretch:75%;font-weight:800;font-size:22px;line-height:1.1}
.mes span{font-size:11.5px;color:var(--ink3)}

/* link */
.link{margin-top:22px;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px}
.link h2{margin:0;font-size:15px;font-weight:700}
.link .u{margin-top:8px;display:flex;align-items:center;gap:8px;background:#0c0c0b;border:1px dashed rgba(245,184,0,.45);border-radius:12px;padding:10px 12px}
.link .u span{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .u button{flex:none;background:none;border:0;color:var(--gold);font-weight:700;font-size:13px;cursor:pointer;padding:4px}
.acoes{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.bt{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--sf2);font-weight:700;font-size:14px;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bt.zap{background:#25D366;border-color:transparent;color:#05210f}
.bt.zap svg{width:19px;height:19px}
.prontas{margin-top:12px}
.prontas summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}
.prontas summary::after{content:"+";color:var(--ink3)}
.prontas[open] summary::after{content:"–"}
.msg{margin-top:10px;background:#0c0c0b;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px;color:var(--ink2);white-space:pre-line}
.msg button{display:block;margin-top:8px;background:none;border:0;padding:0;color:var(--gold);font-weight:700;font-size:12.5px;cursor:pointer}

/* abas */
.abas{position:sticky;top:0;z-index:5;margin:24px -16px 0;padding:8px 16px;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:4px}
.aba{flex:1;background:none;border:0;padding:9px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.aba[aria-selected="true"]{color:var(--ink);background:var(--sf2)}

h3{margin:26px 0 10px;font-family:var(--d);font-stretch:85%;font-weight:800;font-size:18px;letter-spacing:-.01em}
h3 small{font-family:var(--t);font-weight:500;font-size:12.5px;color:var(--ink3);margin-left:6px}
.bloco{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px}
.nota{font-size:12px;color:var(--ink4);margin:8px 2px 0;line-height:1.55}
.vazio{padding:20px 6px;text-align:center;color:var(--ink3);font-size:13.5px}

/* gráfico de ganhos */
.graf{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.graf .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.graf .c i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:#2a2a26;min-height:3px;position:relative}
.graf .c.atual i{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.graf .c em{font-style:normal;font-family:var(--d);font-stretch:72%;font-weight:700;font-size:12.5px;color:var(--ink2)}
.graf .c.atual em{color:var(--gold)}
.graf .c span{font-size:11.5px;color:var(--ink3);text-transform:capitalize}

/* carteira */
.seg{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#1d1d1a;gap:2px}
.seg i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.leg div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.leg b{margin-left:auto;font-family:var(--d);font-stretch:75%;font-weight:800;font-size:17px;color:var(--ink)}
.pt{width:9px;height:9px;border-radius:50%;flex:none}
.renda{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.renda b{font-family:var(--d);font-stretch:72%;font-weight:900;font-size:30px;color:var(--ok);line-height:1}
.renda span{font-size:12.5px;color:var(--ink2)}

/* nível */
.niv .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.niv .top b{font-family:var(--d);font-stretch:85%;font-weight:800;font-size:20px}
.niv .top span{font-size:13px;color:var(--gold);font-weight:600}
.trilha{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.trilha div{height:8px;border-radius:99px;background:#24241f;overflow:hidden}
.trilha div i{display:block;height:100%;background:var(--gold)}
.trilha-nomes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.trilha-nomes span{font-size:11.5px;color:var(--ink4)}
.trilha-nomes span.on{color:var(--gold);font-weight:600}
.niv p{margin:10px 0 0;font-size:13px;color:var(--ink2)}

/* clientes */
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.chip b{font-family:var(--d);font-stretch:75%;margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--goldbg)}
.lista{background:var(--sf);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ini{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:13px;background:var(--sf2);color:var(--ink2)}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm span{font-size:12px;color:var(--ink3)}
.st{flex:none;font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 9px}
.st.ativo{background:var(--okbg);color:var(--ok)} .st.teste{background:var(--testebg);color:var(--teste)}
.st.inadimplente{background:var(--warnbg);color:var(--warn)} .st.cancelado,.st.expirado{background:var(--badbg);color:var(--bad)}
.st.conta,.st.lead{background:var(--sf2);color:var(--ink3)}
.mais{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;color:var(--gold);font-weight:700;font-size:13px;cursor:pointer}
.funil .f{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;padding:7px 0;font-size:13px;color:var(--ink2)}
.funil .f div{height:10px;border-radius:99px;background:#1f1f1c;overflow:hidden}
.funil .f div i{display:block;height:100%;background:var(--gold);border-radius:99px}
.funil .f b{font-family:var(--d);font-stretch:75%;font-weight:800;font-size:16px;text-align:right;color:var(--ink)}

/* ganhos */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k2{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 13px}
.k2 span{font-size:12px;color:var(--ink3)}
.k2 b{display:block;font-family:var(--d);font-stretch:75%;font-weight:800;font-size:22px;margin-top:2px}
.k2 em{font-style:normal;font-size:12px;color:var(--ink3)}
.mesg{margin-top:12px}
.mesg .cab{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 8px}
.mesg .cab b{font-size:14px;font-weight:700;text-transform:capitalize}
.mesg .cab span{font-family:var(--d);font-stretch:75%;font-weight:800;font-size:17px;color:var(--gold)}
.cv{text-align:right;flex:none}
.cv b{display:block;font-family:var(--d);font-stretch:75%;font-weight:800;font-size:17px}
.cv span{font-size:11.5px;color:var(--ink3)}
.tipo{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.tipo.nova{background:var(--goldbg);color:var(--gold)} .tipo.renovacao{background:var(--sf2);color:var(--ink2)}

/* regras e conquistas */
.medalhas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.md .ic{font-size:24px;line-height:1.2}
.md b{display:block;font-size:12px;font-weight:700;margin-top:4px;line-height:1.3}
.md span{font-size:11px;color:var(--ink4)}
.md.ok{border-color:rgba(245,184,0,.45);background:var(--goldbg)} .md.ok span{color:var(--gold)}
.md.lock{opacity:.5}
details.r{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:8px}
details.r summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
details.r summary::after{content:"+";color:var(--ink3)}
details.r[open] summary::after{content:"–"}
details.r p{margin:0 0 13px;font-size:13.5px;color:var(--ink2)}
.camp b{font-size:15px}
.camp p{margin:4px 0 0;font-size:13px;color:var(--ink2)}

.rod{margin-top:30px;text-align:center;font-size:12px;color:var(--ink4)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#000;font-weight:700;font-size:13px;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}
.tela{padding:90px 0;text-align:center;color:var(--ink3)}
.tela .logo{width:56px;height:56px;border-radius:50%;border:5px solid var(--gold);margin:0 auto 16px;position:relative}
.tela .logo:after{content:"";position:absolute;inset:0;margin:auto;width:13px;height:13px;border-radius:50%;background:var(--gold)}
@media (max-width:360px){.recibo .v{font-size:52px}.mes b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="carregando" class="tela"><div class="logo"></div>Abrindo seu painel…</div>
  <div id="erro" class="tela" hidden><div class="logo"></div><p id="erroTxt">Este link não é válido.</p><p style="font-size:12.5px">Peça um link novo pro time da Vant.</p></div>

  <div id="app" hidden>
    <header class="topo">
      <div class="av" id="av">V</div>
      <div style="min-width:0">
        <h1 id="nome">—</h1>
        <p><span class="nv" id="nivelTxt">—</span> <span id="desde"></span></p>
      </div>
    </header>

    <section class="recibo" aria-labelledby="reciboTit">
      <div class="rot"><span id="reciboTit">Seu próximo Pix</span><b id="quandoPix">—</b></div>
      <div class="v n" id="valorPix">—</div>
      <div class="sub" id="subPix">—</div>
      <div class="picote" aria-hidden="true"></div>
      <div class="mes" id="mes"></div>
    </section>

    <section class="link" aria-labelledby="linkTit">
      <h2 id="linkTit">Seu link de indicação</h2>
      <div class="u"><span id="link">—</span><button type="button" id="btCopiar">Copiar</button></div>
      <div class="acoes">
        <button type="button" class="bt zap" id="btZap">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.2.5.1.6 0l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
          Mandar no WhatsApp
        </button>
        <button type="button" class="bt" id="btMais" aria-label="Compartilhar em outro app">Outros</button>
      </div>
      <details class="prontas">
        <summary>Mensagens prontas pra postar</summary>
        <div id="prontas"></div>
      </details>
    </section>

    <nav class="abas" role="tablist" aria-label="Seções do painel">
      <button class="aba" role="tab" aria-selected="true" data-tab="inicio">Início</button>
      <button class="aba" role="tab" aria-selected="false" data-tab="clientes">Clientes</button>
      <button class="aba" role="tab" aria-selected="false" data-tab="ganhos">Ganhos</button>
      <button class="aba" role="tab" aria-selected="false" data-tab="regras">Regras</button>
    </nav>

    <section id="p-inicio" role="tabpanel"></section>
    <section id="p-clientes" role="tabpanel" hidden></section>
    <section id="p-ganhos" role="tabpanel" hidden></section>
    <section id="p-regras" role="tabpanel" hidden></section>

    <p class="rod">Vant Parceiros. Dados de <span id="quando"></span>.</p>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/parceiro.js?v=3" defer></script>
</body>
</html>
