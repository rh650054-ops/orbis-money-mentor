<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Orbis Parceiros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#000;--card:#101010;--card2:#161615;--ink:#F4F1EA;--ink2:#B9B3A6;--ink3:#7E7869;--ink4:#5C574D;--line:rgba(255,255,255,.09);
 --gold:#F5B800;--gold-l:#FFC63A;--gold-d:#B88700;--gold-bg:rgba(245,184,0,.10);--ok:#3DD68C;--ok-bg:rgba(61,214,140,.10);--warn:#F5A54A;--bad:#FF6B57;--bad-bg:rgba(255,107,87,.10);
 --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.015em}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:22px 0 10px}
/* cabeçalho */
.topo{padding:calc(18px + env(safe-area-inset-top,0px)) 0 8px;display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--gold-bg);border:1px solid rgba(245,184,0,.4);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.topo h1{font-size:19px;font-weight:700}
.meta{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.pill.g{border-color:rgba(245,184,0,.45);color:var(--gold);background:var(--gold-bg)}
.linkbox{margin-top:12px;background:var(--card);border:1px solid rgba(245,184,0,.35);border-radius:16px;padding:12px 14px}
.linkbox .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.linkbox .u{font-size:14px;font-weight:600;margin-top:4px;word-break:break-all}
.linkbox .b{display:flex;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:13.5px;border-radius:12px;height:42px;padding:0 16px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;flex:1}
.btn.g{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:#1A1200;border-color:transparent;box-shadow:0 3px 0 var(--gold-d)}
.btn.g:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-d)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.linkbox p{margin:9px 0 0;font-size:12px;color:var(--ink3)}
/* abas */
.tabs{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);margin:14px -16px 0;padding:8px 16px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-size:12px;font-weight:700;color:var(--ink3);background:none;border:0;padding:9px 2px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--card2)}
/* cards */
.big{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.big.g{border-color:rgba(245,184,0,.45);background:linear-gradient(180deg,rgba(245,184,0,.12),rgba(245,184,0,.04))}
.big .k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.big.g .k{color:var(--gold)}
.big .v{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.big.g .v{color:var(--gold)}
.big .s{font-size:12px;color:var(--ink3);margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0}
.st .k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);line-height:1.3}
.st .v{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.st .s{font-size:11px;color:var(--ink4);margin-top:3px}
.st.ok .v{color:var(--ok)} .st.bad .v{color:var(--bad)} .st.warn .v{color:var(--warn)} .st.g .v{color:var(--gold)}
.st.hero{grid-column:1/-1;border-color:rgba(245,184,0,.45);background:var(--gold-bg)}
.st.hero .v{font-size:40px;color:var(--gold)}
/* nível */
.nivel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.nivel .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nivel .n{font-size:20px;font-weight:800}
.nivel .n small{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.bar{height:10px;border-radius:99px;background:#1c1c1b;border:1px solid var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.2,0,0,1)}
.nivel .f{font-size:12.5px;color:var(--ink2);margin-top:8px}
.niveis{display:flex;gap:6px;margin-top:12px}
.niveis span{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:9px;border:1px solid var(--line);color:var(--ink4)}
.niveis span.on{border-color:rgba(245,184,0,.45);color:var(--gold);background:var(--gold-bg)}
.niveis span.ok{color:var(--ink2)}
/* funil */
.funil{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-top:10px}
.fl{display:grid;grid-template-columns:1fr 60px 62px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.fl:last-child{border-bottom:0}
.fl b{font-size:16px;text-align:right}
.fl i{font-style:normal;font-size:11px;color:var(--ink3);text-align:right}
/* listas */
.lista{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-size:14px;font-weight:600}
.li .nm span{font-size:11.5px;color:var(--ink3)}
.li .r{text-align:right;flex:none}
.li .r b{display:block;font-size:15px;font-weight:700}
.li .r span{font-size:11px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);flex:none}
.dot.ativo{background:var(--ok)} .dot.teste{background:var(--gold)} .dot.inadimplente{background:var(--warn)} .dot.cancelado,.dot.expirado{background:var(--bad)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.tag.confirmada{background:var(--ok-bg);color:var(--ok)} .tag.paga{background:var(--gold-bg);color:var(--gold)} .tag.pendente{background:rgba(245,165,74,.12);color:var(--warn)} .tag.cancelada{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.chip[aria-pressed="true"]{border-color:rgba(245,184,0,.5);color:var(--gold);background:var(--gold-bg)}
.vazio{padding:22px 14px;text-align:center;color:var(--ink3);font-size:13px}
/* conquistas */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.bd .ic{font-size:22px}
.bd .t{font-size:11.5px;font-weight:700;line-height:1.25}
.bd .s{font-size:10.5px;color:var(--ink4)}
.bd.ok{border-color:rgba(245,184,0,.45);background:var(--gold-bg)}
.bd.ok .s{color:var(--gold)}
.bd.lock{opacity:.55}
.camp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.camp b{font-size:15px}
.camp p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
.termos{margin-top:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:8px}
summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:13.5px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--ink3)}
details[open] summary::after{content:"–"}
details p{margin:0 0 12px;font-size:13px;color:var(--ink2)}
.nota{font-size:11.5px;color:var(--ink4);margin:8px 2px 0;line-height:1.5}
.rodape{margin-top:28px;text-align:center;font-size:11.5px;color:var(--ink4)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#000;font-weight:700;font-size:13px;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast[data-on="1"]{opacity:1;transform:translateX(-50%)}
.carregando{padding:80px 0;text-align:center;color:var(--ink3)}
.logo{width:60px;height:60px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 32px -6px rgba(255,255,255,.45);position:relative;margin:0 auto 18px}
.logo:after{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="carregando" class="carregando"><div class="logo"></div>Abrindo seu painel…</div>
  <div id="erro" class="carregando" hidden><div class="logo"></div><p id="erroTxt">Este link não é válido.</p><p style="font-size:12px">Peça um link novo pro time do Orbis.</p></div>
  <div id="app" hidden>
    <div class="topo">
      <div class="av" id="av">V</div>
      <div style="min-width:0;flex:1">
        <h1 id="nome">—</h1>
        <div class="meta"><span class="pill g" id="nivelPill">—</span><span id="codigo">—</span><span id="desde"></span></div>
      </div>
    </div>
    <div class="linkbox">
      <div class="l">Seu link de indicação</div>
      <div class="u" id="link">—</div>
      <div class="b"><button class="btn g" id="btCopiar">Copiar link</button><button class="btn" id="btCompartilhar">Compartilhar</button></div>
      <p>Compartilhe seu link. Quando alguém assinar pelo seu código, você recebe comissão.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="geral">Visão geral</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="carteira">Carteira</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="comissoes">Comissões</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="conquistas">Conquistas</button>
    </div>

    <section id="p-geral"></section>
    <section id="p-carteira" hidden></section>
    <section id="p-comissoes" hidden></section>
    <section id="p-conquistas" hidden></section>

    <div class="rodape">Orbis Parceiros · dados atualizados <span id="quando"></span></div>
  </div>
</div>
<div id="toast"></div>
<script src="/parceiro.js?v=2" defer></script>
</body>
</html>
