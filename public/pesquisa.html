<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0D">
<title>VANT · Me conta a real</title>
<meta name="description" content="3 minutos. Sua resposta decide o que a VANT constrói primeiro.">
<link rel="icon" href="/vant-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#0B0B0D; --bg2:#121316; --card:#17181C; --card2:#1E2025;
  --ink:#F4F4F2; --dim:#A3A7B0; --faint:#6B707A; --line:#262930; --line2:#343842;
  --ama:#FFB020; --ama2:#FFC94D; --ama-s:rgba(255,176,32,.14);
  --ok:#2ED47A; --bad:#FF5A5A;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ama);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}

/* fundo: brilho amarelo discreto no topo */
.glow{position:fixed;inset:-40% -20% auto;height:70vh;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,176,32,.16),transparent 60%)}

/* casca */
.shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
.top img{height:22px;width:auto;display:block}
.top .sp{flex:1}
.top .n{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.prog{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:26px}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ama),var(--ama2));transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* uma pergunta por tela */
.q{flex:1;display:flex;flex-direction:column;animation:in .38s cubic-bezier(.2,.8,.2,1)}
.q.out{animation:out .22s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-10px)}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ama);margin-bottom:10px}
h1{font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:700;margin-bottom:8px}
h2{font-size:25px;line-height:1.15;letter-spacing:-.022em;font-weight:700;margin-bottom:8px}
.sub{color:var(--dim);font-size:15px;margin-bottom:22px}
.sub b{color:var(--ink)}

/* opções */
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 15px;border-radius:14px;
  background:var(--card);border:1.5px solid var(--line);transition:transform .12s,border-color .15s,background .15s;min-height:54px}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--line2);background:var(--card2)}
.opt[aria-pressed="true"]{border-color:var(--ama);background:var(--ama-s)}
.opt .ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--bg2);border:1px solid var(--line)}
.opt[aria-pressed="true"] .ic{background:var(--ama);border-color:var(--ama);color:#111}
.opt .t{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.3}
.opt .t small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:1px}
.opt .ck{width:22px;height:22px;border-radius:50%;flex:none;border:1.5px solid var(--line2);display:grid;place-items:center}
.opt[aria-pressed="true"] .ck{background:var(--ama);border-color:var(--ama)}
.opt .ck svg{opacity:0}.opt[aria-pressed="true"] .ck svg{opacity:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.grid .opt{flex-direction:column;align-items:flex-start;gap:9px;padding:13px;min-height:92px}
.grid .opt .ck{position:absolute}
.grid .opt{position:relative}
.grid .opt .ck{top:11px;right:11px}
.grid .opt .t{font-size:14px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}

/* escala 0–10 e emojis */
.escala{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.escala button{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;transition:all .12s}
.escala button:hover{border-color:var(--line2)}
.escala button[aria-pressed="true"]{background:var(--ama);border-color:var(--ama);color:#111;transform:scale(1.08)}
.escala-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:8px}
.emos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.emos .opt{flex-direction:column;text-align:center;align-items:center;gap:6px;padding:14px 8px;min-height:104px}
.emos .opt .e{font-size:32px;line-height:1}
.emos .opt .t{font-size:13px;font-weight:600;text-align:center}
.emos .opt .ck{display:none}

/* texto */
textarea,input[type=text],input[type=tel],input[type=password]{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;color:var(--ink);font-size:16px;transition:border-color .15s}
textarea{min-height:120px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{border-color:var(--ama);outline:none}
textarea::placeholder,input::placeholder{color:var(--faint)}
.hint{font-size:12.5px;color:var(--faint);margin-top:8px}
.outro{margin-top:10px}

/* rodapé de navegação */
.nav{display:flex;gap:10px;align-items:center;margin-top:26px;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 20px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .12s,opacity .15s,background .15s;min-height:52px}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--ama);color:#111;flex:1}
.btn.go:hover{background:var(--ama2)}
.btn.go[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{color:var(--dim);padding:15px 12px}
.btn.ghost:hover{color:var(--ink)}
.btn.back{width:52px;padding:0;border:1.5px solid var(--line);color:var(--dim);border-radius:14px}
.btn.back:hover{color:var(--ink);border-color:var(--line2)}
.pular{font-size:13px;color:var(--faint);text-decoration:underline;text-underline-offset:3px}
.pular:hover{color:var(--dim)}

/* intro / fim */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:10px 0}
.hero img.masc{height:clamp(84px,20vw,120px);width:auto;align-self:flex-start;margin:0 0 14px;filter:drop-shadow(0 10px 18px rgba(255,176,32,.18))}
@media(min-width:560px){.hero img.masc{height:140px}}
.hero h1{font-size:36px}
.hero .sub{font-size:16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 20px}
.chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.chip b{color:var(--ama)}
.fim .ok{width:64px;height:64px;border-radius:50%;background:var(--ama);display:grid;place-items:center;margin:0 auto 18px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.fim{text-align:center}
.fim h1{font-size:32px}
.fim .btn{flex:none}
.avante{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ama);font-weight:700;margin-top:26px}
footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
footer button{text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
footer a,footer button{color:var(--faint);font-size:12px;text-decoration:none}
footer button:hover,footer a:hover{color:var(--dim)}
.erro{margin-top:12px;font-size:13px;color:var(--bad);min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:92vw}
.toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}

/* ===== ADMIN ===== */
.adm{max-width:1080px}
.adm h1{font-size:26px}
.loginbox{max-width:380px;margin:40px auto;display:grid;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card .v{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--dim);margin-top:2px}
.sec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.barras{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:var(--ama)}
.bar .n{font-variant-numeric:tabular-nums;color:var(--dim);min-width:52px;text-align:right}
.duas{display:grid;gap:14px}
@media(min-width:800px){.duas{grid-template-columns:1fr 1fr}}
.cit{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cit:last-child{border-bottom:0}
.cit .q{font-size:11.5px;color:var(--faint);margin-top:3px;display:block;animation:none}
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 8px;border-bottom:1px solid var(--line2)}
.tab td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr.r{cursor:pointer}.tab tr.r:hover td{background:var(--card2)}
.tab .det td{background:var(--bg2);font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:6px 0}
.kv .k{color:var(--faint);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.ama{color:var(--ama);border-color:var(--ama)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.filtros select,.filtros input{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink)}
.filtros .btn{padding:8px 12px;min-height:0;font-size:13px}
.tiny{font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="glow"></div>

<main class="shell" id="app">
  <div class="top">
    <img src="/vant-wordmark.png" alt="VANT">
    <span class="sp"></span>
    <span class="n" id="passo"></span>
  </div>
  <div class="prog" id="prog"><i></i></div>
  <section id="tela" aria-live="polite"></section>
  <footer>
    <span>© VANT · suas respostas ficam só com a gente</span>
    <button id="btEquipe" type="button">equipe VANT</button>
  </footer>
</main>

<main class="shell adm" id="admin" hidden></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/pesquisa.js"></script>
</body>
</html>
