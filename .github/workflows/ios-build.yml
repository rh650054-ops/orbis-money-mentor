# Builds the VANT iPhone app on a GitHub macOS runner (no Mac needed).
#
# Run it from GitHub: Actions > "iOS build" > Run workflow.
#
# Stage 1 — works TODAY, without an Apple account:
#   compiles the app for the iOS Simulator (unsigned). Green = the native project,
#   the web bundle and the Capacitor plugins all build for iPhone.
#
# Stage 2 — after the Apple Developer account is active:
#   with the secrets below set, the same run also archives a SIGNED build and
#   uploads it straight to App Store Connect / TestFlight.
#
# One-time setup in GitHub > Settings > Secrets and variables > Actions
# (never paste these values in a chat):
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (same as the Android build)
#              APPLE_TEAM_ID       (10 characters, App Store Connect > Membership)
#   Secrets:   ASC_KEY_ID, ASC_ISSUER_ID,
#              ASC_KEY_P8_BASE64   (the .p8 App Store Connect API key, base64; role Admin,
#                                   so Apple can sign the export with its cloud-managed certificate)
#
# Signing (27/11/2026): the archive is built UNSIGNED and only the export is signed, by Apple's
# cloud signing ("Distribution Managed" certificate, kept by Apple, reused by every run). Before,
# the archive was signed with an "Apple Development" certificate that Xcode created on every run
# (the runner keeps nothing), until the account hit Apple's limit and build 15 was refused.
# The app declares no entitlements (no .entitlements file), so nothing is lost by signing at export.
# "enviar = false" checks the whole signing without uploading a build to TestFlight.
#   Billing:   "link" by default since 24/11/2026 (Rick's decision, all store versions):
#              no access -> yellow "VER PLANOS E ASSINAR" / "RENOVAR ASSINATURA" opening the
#              site / Hotmart checkout. Known risk: in Brazil Apple allows link-outs only with
#              the StoreKit External Purchase entitlement and IAP shown alongside (guideline
#              3.1.1) -> rejection risk on the next submission.
#              Kill switch without code: variable VITE_COBRANCA_LOJA_IOS = fora, then rebuild.
#              Native Apple subscriptions (27/11/2026, Etapa 3): VITE_COBRANCA_LOJA_IOS = apple.
#              NOT the default: it is switched on by Rick, by this variable, when the server side
#              (PR #373) is in production and the products exist in App Store Connect.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      enviar:
        description: "Upload to TestFlight (false = only check the signing, nothing is uploaded)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        # "bash" (not the implicit default) adds -o pipefail: without it
        # "xcodebuild ... | tail -40" hid every failure and the run went green.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pick the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_COBRANCA_LOJA: ${{ vars.VITE_COBRANCA_LOJA_IOS || 'link' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing repo variable VITE_SUPABASE_URL"; exit 1; }
          case "$VITE_COBRANCA_LOJA" in fora|link|apple) ;; *) echo "VITE_COBRANCA_LOJA_IOS must be fora, link or apple"; exit 1;; esac
          echo "::notice::iPhone billing mode: $VITE_COBRANCA_LOJA"
          npm run build

      - name: Copy web bundle into the iOS project
        run: npx cap sync ios

      - name: Stage 1 — compile for the Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Stage 2 — signed archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          ENVIAR: ${{ inputs.enviar }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Apple secrets not set yet: stopped after the Simulator build (stage 1)."
            exit 0
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version_name must look like 1.0.0"; exit 1; }
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 key. Redo the base64 of the AuthKey file."; exit 1; }

          # Ask Apple directly whether the key works, so a bad value fails here with a clear message
          # instead of a 401 buried in the xcodebuild log.
          JWT=$(KEY="$KEY" node -e '
            const c = require("crypto"), fs = require("fs");
            const b = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
            const now = Math.floor(Date.now() / 1000);
            const data = b({ alg: "ES256", kid: process.env.ASC_KEY_ID.trim(), typ: "JWT" }) + "." +
              b({ iss: process.env.ASC_ISSUER_ID.trim(), iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
            const sig = c.sign("sha256", Buffer.from(data), { key: fs.readFileSync(process.env.KEY), dsaEncoding: "ieee-p1363" });
            process.stdout.write(data + "." + sig.toString("base64url"));')
          HTTP=$(curl -s -o "$RUNNER_TEMP/asc.json" -w "%{http_code}" -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=app.vant.vendas")
          case "$HTTP" in
            200) grep -q '"bundleId"' "$RUNNER_TEMP/asc.json" \
                   && echo "::notice::App Store Connect key OK and app app.vant.vendas found." \
                   || { echo "::error::Key OK, but no app with bundle id app.vant.vendas in App Store Connect."; exit 1; } ;;
            401) echo "::error::Apple rejected the API key (401). Check ASC_ISSUER_ID (long id at the top of the Team Keys page), ASC_KEY_ID (10 chars, same key as the .p8) and that the key was not revoked."; exit 1 ;;
            403) echo "::error::Key accepted but without permission (403). The key must be a TEAM key with role Admin, and all agreements must be accepted in App Store Connect."; exit 1 ;;
            *)   echo "::error::Unexpected answer from App Store Connect: HTTP $HTTP"; head -c 400 "$RUNNER_TEMP/asc.json"; exit 1 ;;
          esac
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Signing mode. Without DIST_CERT_P12_BASE64 nothing changes: Apple's cloud signing, exactly as
          # in build 19. With it ("proprio"), the export uses our own Apple Distribution certificate and
          # the two App Store profiles created by hand in the portal, because Apple's API key cannot read
          # App Groups and so cannot create the VANT Quick profile by itself (401 on xcbuild/v1/appGroups).
          MODO=nuvem
          if [ -n "$DIST_CERT_P12_BASE64" ]; then
            MODO=proprio
            [ -n "$DIST_CERT_PASSWORD" ] || { echo "::error::DIST_CERT_PASSWORD is missing."; exit 1; }
            # Temporary keychain with a random password; deleted in the "Clean up signing" step.
            KC="$RUNNER_TEMP/vant-assinatura.keychain-db"
            KCPASS=$(openssl rand -hex 24)
            security create-keychain -p "$KCPASS" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KCPASS" "$KC"
            P12="$RUNNER_TEMP/dist.p12"
            echo "$DIST_CERT_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$P12"
            security import "$P12" -k "$KC" -P "$DIST_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null \
              || { rm -f "$P12"; echo "::error::Could not import the .p12 (wrong DIST_CERT_PASSWORD or bad base64)."; exit 1; }
            rm -f "$P12"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            IDENT=$(security find-identity -v -p codesigning "$KC" | grep -o '"Apple Distribution[^"]*"' | head -1 | tr -d '"')
            [ -n "$IDENT" ] || { echo "::error::The .p12 has no valid Apple Distribution identity (certificate + private key)."; exit 1; }
            echo "::notice::Own certificate loaded: $IDENT"

            # The two App Store profiles are read from Apple with the API key (that part is allowed).
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            for NOME in "VANT App Store" "VANT Quick App Store"; do
              curl -s -G -H "Authorization: Bearer $JWT" --data-urlencode "filter[name]=$NOME" \
                --data-urlencode "filter[profileState]=ACTIVE" "https://api.appstoreconnect.apple.com/v1/profiles" > "$RUNNER_TEMP/perfil.json"
              ARQ="$RUNNER_TEMP/perfil.mobileprovision"
              node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1])).data||[];
                if(!d.length){process.exit(3)}
                require("fs").writeFileSync(process.argv[2],Buffer.from(d[0].attributes.profileContent,"base64"))' \
                "$RUNNER_TEMP/perfil.json" "$ARQ" || { echo "::error::Active profile \"$NOME\" not found in the Apple portal."; exit 1; }
              UUID=$(security cms -D -i "$ARQ" | plutil -extract UUID raw -)
              cp "$ARQ" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
              cp "$ARQ" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
              security cms -D -i "$ARQ" | grep -q 'group.app.vant.vendas' \
                || { echo "::error::Profile \"$NOME\" was made before App Groups was enabled. Edit it in the portal (Save) to regenerate."; exit 1; }
              echo "::notice::Profile \"$NOME\" installed ($UUID), with the App Group."
            done
            rm -f "$RUNNER_TEMP/perfil.json" "$RUNNER_TEMP/perfil.mobileprovision"
          fi

          # unsigned archive: no "Apple Development" certificate is created (see the header)
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VANT.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -40
          test -d "$RUNNER_TEMP/VANT.xcarchive/Products/Applications/App.app/PlugIns/VantQuick.appex" \
            || { echo "::error::The VANT Quick extension is not embedded in the archive."; exit 1; }
          # The export re-signs each binary with the entitlements it finds in the binary's own
          # signature, and an unsigned binary has none: the App Group of VANT Quick would be lost.
          # So stamp them with a local ad-hoc signature ("-", no certificate, nothing at Apple),
          # inner code first. Xcode 26 forbids ad-hoc inside the build, codesign itself does not.
          APPDIR="$RUNNER_TEMP/VANT.xcarchive/Products/Applications/App.app"
          find "$APPDIR/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements ios/App/VantQuick/VantQuick.entitlements "$APPDIR/PlugIns/VantQuick.appex"
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APPDIR"
          [ "$ENVIAR" = "false" ] && DESTINO=export || DESTINO=upload

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINO}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          if [ "$MODO" = "proprio" ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINO}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>app.vant.vendas</key><string>VANT App Store</string>
              <key>app.vant.vendas.quick</key><string>VANT Quick App Store</string>
            </dict>
          </dict></plist>
          PLIST
            # manual signing: no provisioning updates, the upload still authenticates with the key
            AUTH=(-authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          fi
          echo "::notice::Signing mode: $MODO"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VANT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || EXPORT_FALHOU=1
          tail -40 "$RUNNER_TEMP/export.log"
          if [ -n "${EXPORT_FALHOU:-}" ]; then
            # Apple's own answer is only in the distribution logs; show the relevant lines.
            LOGS=$(grep -o '/[^"]*\.xcdistributionlogs' "$RUNNER_TEMP/export.log" | head -1)
            [ -n "$LOGS" ] && grep -rhoE 'got status code [0-9]+ to a [A-Z]+ request to URL: [^ ]{0,160}' "$LOGS" 2>/dev/null | sort -u | head -60
            [ -n "$LOGS" ] && grep -rhE -B25 -A8 '"status" : "40[0-9]"' "$LOGS" 2>/dev/null | grep -viE 'PRIVATE KEY|BEGIN|eyJ' | sed -E 's/issuer: [^ >]+/issuer: ***/' | cut -c1-300 | head -80
            rm -f "$KEY"; exit 70
          fi
          rm -f "$KEY"
          if [ "$DESTINO" = "export" ]; then
            IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
            ASSINATURA=$(codesign -dvv "$RUNNER_TEMP"/ipa/Payload/*.app 2>&1 | grep '^Authority=' | head -1)
            echo "::notice::Signing check only, nothing uploaded. Signed by: ${ASSINATURA#Authority=}"
            [[ "$ASSINATURA" == *"Apple Distribution"* ]] || { echo "::error::The export is not signed with an Apple Distribution certificate."; exit 1; }
            # VANT Quick: the extension must be signed too, and both must carry the shared App Group.
            for ALVO in "$RUNNER_TEMP"/ipa/Payload/*.app "$RUNNER_TEMP"/ipa/Payload/*.app/PlugIns/VantQuick.appex; do
              NOME=$(basename "$ALVO")
              QUEM=$(codesign -dvv "$ALVO" 2>&1 | grep '^Authority=' | head -1)
              [[ "$QUEM" == *"Apple Distribution"* ]] || { echo "::error::$NOME is not signed with Apple Distribution."; exit 1; }
              codesign -d --entitlements :- "$ALVO" 2>/dev/null > "$RUNNER_TEMP/ent-$NOME.plist"
              grep -q 'group.app.vant.vendas' "$RUNNER_TEMP/ent-$NOME.plist" \
                || { echo "::error::$NOME is missing the App Group group.app.vant.vendas."; cat "$RUNNER_TEMP/ent-$NOME.plist"; exit 1; }
              echo "::notice::$NOME signed (${QUEM#Authority=}) with App Group group.app.vant.vendas."
            done
          else
            echo "::notice::Build $VERSION_NAME ($BUILD_NUMBER) sent to App Store Connect. It shows up in TestFlight after Apple processes it (~15-30 min)."
          fi

      - name: Clean up signing
        if: always()
        run: |
          KC="$RUNNER_TEMP/vant-assinatura.keychain-db"
          [ -f "$KC" ] && security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP"/AuthKey.p8 "$RUNNER_TEMP"/dist.p12
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
