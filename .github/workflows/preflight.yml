# Runs on every pull request: nothing merges on "it compiled".
#   app     lint + typecheck + unit tests (the same `npm run preflight` asked for in CLAUDE.md)
#   sql     the financial chain against a throwaway Postgres, with fictional data
#   drift   the repo still describes what production runs (no secret needed: compares fingerprints)
# No job here can reach production: there is no Supabase credential in this workflow.
name: preflight
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run preflight
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env: { PGHOST: 127.0.0.1, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run test:sql
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run drift
